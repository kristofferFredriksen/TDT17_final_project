# Architecture comparison: transformer encoder (SegFormer / MiT-B2) vs the CNN U-Net baseline.
# Everything except arch/encoder is identical to baseline.yaml.
name: segformer_b2
arch: Segformer
encoder: mit_b2
encoder_weights: imagenet

max_long_side: 1024
crop: 512

epochs: 40
patience: null       # no early stopping; best val-IoU checkpoint is kept
batch_size: 8
lr: 3.0e-4
weight_decay: 1.0e-4
num_workers: 8
seed: 0
