# U-Net + ImageNet ResNet34, binary damage vs background, trained on all Pothole-Mix subsets.
name: unet_r34_baseline
arch: Unet
encoder: resnet34
encoder_weights: imagenet

max_long_side: 1024   # downscale-only; at 512 thin cracks shrink to ~1.5 px (see segmentation/eda.ipynb)
crop: 512

epochs: 40
patience: null       # no early stopping; best val-IoU checkpoint is kept
batch_size: 8
lr: 3.0e-4
weight_decay: 1.0e-4
num_workers: 8
seed: 0
